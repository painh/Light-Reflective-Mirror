<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRM Relay Server Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        h1 {
            font-size: 24px;
            color: #fff;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
        }
        .status-dot.disconnected {
            background: #ef4444;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #16213e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }
        .stat-card h3 {
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
        }
        .stat-card .sub {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        .rooms-section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #fff;
        }
        .room-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .room-card {
            background: #16213e;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            align-items: center;
            gap: 20px;
        }
        .room-info h4 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        .room-info .meta {
            font-size: 12px;
            color: #888;
        }
        .room-players {
            text-align: center;
        }
        .room-players .count {
            font-size: 18px;
            font-weight: bold;
        }
        .room-players .label {
            font-size: 11px;
            color: #888;
        }
        .room-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .room-status.public {
            background: #22c55e20;
            color: #4ade80;
        }
        .room-status.private {
            background: #f59e0b20;
            color: #fbbf24;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .server-info {
            background: #16213e;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 30px;
        }
        .server-info h3 {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
        }
        .server-info .endpoints {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .server-info .endpoint {
            font-family: monospace;
            font-size: 13px;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .server-info .endpoint .label {
            color: #888;
            margin-right: 8px;
        }
        .server-info .endpoint .value {
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>LRM Relay Server</h1>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </header>

        <div class="server-info">
            <h3>Server Endpoints</h3>
            <div class="endpoints">
                <div class="endpoint">
                    <span class="label">Relay:</span>
                    <span class="value">relay.nod.kr:7777</span>
                </div>
                <div class="endpoint">
                    <span class="label">NAT Punch:</span>
                    <span class="value">relay.nod.kr:7776</span>
                </div>
                <div class="endpoint">
                    <span class="label">API:</span>
                    <span class="value">relay.nod.kr:8092</span>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Connected Clients</h3>
                <div class="value" id="statClients">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Rooms</h3>
                <div class="value" id="statRooms">0</div>
            </div>
            <div class="stat-card">
                <h3>Public Rooms</h3>
                <div class="value" id="statPublicRooms">0</div>
            </div>
            <div class="stat-card">
                <h3>Uptime</h3>
                <div class="value" id="statUptime">-</div>
            </div>
        </div>

        <div class="rooms-section">
            <h2>Active Rooms</h2>
            <div class="room-list" id="roomList">
                <div class="empty-state">No active rooms</div>
            </div>
        </div>
    </div>

    <script>
        let refreshInterval;

        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();

                document.getElementById('statClients').textContent = stats.ConnectedClients || 0;
                document.getElementById('statRooms').textContent = stats.RoomCount || 0;
                document.getElementById('statPublicRooms').textContent = stats.PublicRoomCount || 0;

                // Format uptime
                if (stats.Uptime) {
                    const uptime = parseUptime(stats.Uptime);
                    document.getElementById('statUptime').textContent = uptime;
                }

                updateStatus(true);
            } catch (error) {
                updateStatus(false);
            }
        }

        async function fetchRooms() {
            try {
                const response = await fetch('/api/servers');
                const rooms = await response.json();
                renderRooms(rooms || []);
            } catch (error) {
                console.error('Failed to fetch rooms:', error);
            }
        }

        function parseUptime(uptimeStr) {
            // Parse TimeSpan format like "1.02:30:45.123"
            const match = uptimeStr.match(/(?:(\d+)\.)?(\d{2}):(\d{2}):(\d{2})/);
            if (!match) return uptimeStr;

            const days = match[1] ? parseInt(match[1]) : 0;
            const hours = parseInt(match[2]);
            const minutes = parseInt(match[3]);

            if (days > 0) {
                return `${days}d ${hours}h`;
            } else if (hours > 0) {
                return `${hours}h ${minutes}m`;
            } else {
                return `${minutes}m`;
            }
        }

        function renderRooms(rooms) {
            const container = document.getElementById('roomList');

            if (rooms.length === 0) {
                container.innerHTML = '<div class="empty-state">No active rooms</div>';
                return;
            }

            container.innerHTML = rooms.map(room => `
                <div class="room-card">
                    <div class="room-info">
                        <h4>${escapeHtml(room.serverName || 'Unnamed Room')}</h4>
                        <div class="meta">
                            ID: ${escapeHtml(room.serverId)} | Host: ${escapeHtml(room.hostId || 'Unknown')}
                        </div>
                    </div>
                    <div class="room-players">
                        <div class="count">${room.currentPlayers || 0}/${room.maxPlayers || '?'}</div>
                        <div class="label">Players</div>
                    </div>
                    <div class="room-status ${room.isPublic ? 'public' : 'private'}">
                        ${room.isPublic ? 'Public' : 'Private'}
                    </div>
                </div>
            `).join('');
        }

        function updateStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (connected) {
                dot.classList.remove('disconnected');
                text.textContent = 'Connected';
            } else {
                dot.classList.add('disconnected');
                text.textContent = 'Disconnected';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function refresh() {
            fetchStats();
            fetchRooms();
        }

        // Initial load
        refresh();

        // Refresh every 2 seconds
        refreshInterval = setInterval(refresh, 2000);
    </script>
</body>
</html>
